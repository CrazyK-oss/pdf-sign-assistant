name: Release

# Publica una versión nueva en GitHub Releases.
#
# Uso:
#   1. Subir el número en modules/version.py y commitear
#   2. git tag v0.7.0 && git push origin v0.7.0
#
# El workflow compila el .exe en un Windows limpio, arma el instalador y
# sube ambos artefactos al Release. Compilar en CI (y no a mano) evita el
# clásico "en mi máquina andaba": el runner no tiene nada instalado de más.
#
# También se puede disparar a mano desde la pestaña Actions. Por defecto
# sólo compila, para probar el build sin publicar nada; marcando
# `publicar` crea el tag y el Release desde acá mismo, tomando el número
# de modules/version.py.
#
# Ese modo existe porque no siempre se puede empujar un tag desde donde se
# está trabajando (credenciales limitadas a las ramas, políticas de
# egress). `gh release create --target <sha>` crea el tag del lado del
# servidor, así que el resultado es idéntico al del disparo por tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publicar:
        description: >-
          Crear el tag y publicar el Release (si no, sólo compila)
        type: boolean
        default: false

permissions:
  contents: write        # necesario para crear el Release

jobs:
  build-windows:
    name: Compilar para Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Acá sí corren los tests de integración: este job instala
      # requirements.txt completo, así que tiene PyQt6, PyMuPDF y Pillow.
      # En el CI liviano se saltean solos.
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen    # los de integración crean una QApplication
        run: pytest tests/ -q

      - name: Leer la versión del proyecto
        id: version
        shell: bash
        run: echo "version=$(python -m modules.version)" >> "$GITHUB_OUTPUT"

      # Un único lugar decide si esta corrida publica, para no repetir la
      # condición en cada paso de abajo.
      - name: Decidir si se publica
        id: modo
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "publicar=true"  >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "Publicando por tag: ${GITHUB_REF_NAME}"
          elif [ "${{ inputs.publicar }}" = "true" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "Publicando a pedido: v${{ steps.version.outputs.version }}"
            echo "El tag lo crea 'gh release create --target' sobre $GITHUB_SHA"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "Sólo compilación: no se publica nada."
          fi

      # Si el tag y modules/version.py no coinciden, el Release quedaría
      # etiquetado con un número y la app mostrando otro.
      - name: Verificar que el tag coincida con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proyecto="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$proyecto" ]; then
            echo "::error::El tag es v$tag pero modules/version.py dice $proyecto."
            echo "Actualizá modules/version.py o recreá el tag."
            exit 1
          fi
          echo "Tag y versión coinciden: $proyecto"

      # Publicar a pedido sobre un tag que ya existe sobrescribiría una
      # versión ya distribuida: mejor frenar y que suban el número.
      - name: Verificar que la versión no esté publicada
        if: steps.modo.outputs.publicar == 'true' && github.ref_type != 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.modo.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::El release $tag ya existe."
            echo "Subí el número en modules/version.py y agregá su sección"
            echo "al CHANGELOG antes de volver a publicar."
            exit 1
          fi
          echo "$tag está libre."

      # Las notas del Release salen de CHANGELOG.md, no de una plantilla
      # fija. El actualizador interno muestra ese mismo texto al avisar
      # que hay versión nueva, así que si esto quedara vacío el usuario
      # vería un aviso que no le dice qué cambió.
      #
      # `python -m modules.changelog` sale con código 1 si la versión no
      # tiene sección: mejor frenar el build que publicar notas vacías.
      - name: Extraer los cambios del CHANGELOG
        shell: bash
        run: |
          ver="${{ steps.version.outputs.version }}"
          if ! python -m modules.changelog "$ver" > cambios.md; then
            echo "::error::CHANGELOG.md no tiene una sección para $ver."
            echo "Agregá un encabezado '## $ver — Título' con los cambios."
            exit 1
          fi
          echo "Cambios extraídos ($(wc -l < cambios.md) líneas):"
          cat cambios.md

      - name: Compilar con PyInstaller
        run: pyinstaller pdf_sign_assistant.spec --noconfirm

      - name: Verificar que el ejecutable exista
        shell: bash
        run: |
          exe="dist/PDF Sign Assistant/PDF Sign Assistant.exe"
          test -f "$exe" || { echo "::error::No se generó $exe"; exit 1; }
          echo "Ejecutable OK ($(du -h "$exe" | cut -f1))"

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Armar el instalador
        shell: pwsh
        run: |
          # OJO con "$env:ProgramFiles(x86)": NO funciona. PowerShell corta
          # el nombre de la variable en el paréntesis y concatena "(x86)"
          # como texto suelto, dando "C:\Program Files(x86)" —sin el
          # espacio—, que no existe. Los nombres de variable con paréntesis
          # necesitan llaves: ${env:ProgramFiles(x86)}.
          $candidatos = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            "$env:ChocolateyInstall\bin\ISCC.exe"
          )
          $iscc = $candidatos |
            Where-Object { $_ -and (Test-Path -LiteralPath $_) } |
            Select-Object -First 1

          if (-not $iscc) {
            # Último recurso: el shim que deja Chocolatey en el PATH
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }

          if (-not $iscc) {
            Write-Host "::error::No se encontró ISCC.exe. Rutas probadas:"
            $candidatos | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

          Write-Host "Inno Setup encontrado en: $iscc"
          & $iscc "installer\pdf_sign_assistant.iss" `
                  "/DAppVersion=${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::ISCC devolvió $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      # ZIP portable: para quien no quiere o no puede instalar nada.
      # El portable.txt hace que la app guarde todo junto al ejecutable.
      - name: Armar el ZIP portable
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $src = "dist\PDF Sign Assistant"
          Set-Content -Path "$src\portable.txt" -Value @"
          La presencia de este archivo activa el MODO PORTABLE:
          la configuracion, los logs y los documentos firmados se guardan
          junto a la aplicacion en vez de en las carpetas del usuario.

          Borra este archivo si preferis el comportamiento normal.
          "@
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          Compress-Archive -Path "$src\*" `
            -DestinationPath "dist\installer\PDFSignAssistant-$ver-portable.zip" `
            -CompressionLevel Optimal

      - name: Calcular checksums
        shell: pwsh
        working-directory: dist/installer
        run: |
          Get-FileHash *.exe, *.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Guardar artefactos del build
        uses: actions/upload-artifact@v5
        with:
          name: windows-${{ steps.version.outputs.version }}
          path: dist/installer/*
          retention-days: 14

      - name: Publicar el Release
        if: steps.modo.outputs.publicar == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.version.outputs.version }}"
          tag="${{ steps.modo.outputs.tag }}"

          # Orden deliberado: primero QUÉ CAMBIÓ, después cómo descargar.
          # El actualizador interno corta en la sentinela y muestra sólo la
          # primera mitad, que es lo único que le interesa a quien ya tiene
          # la app instalada.
          instrucciones="$(cat <<EOF
          ## Descargar

          | Archivo | Para quién |
          |---------|-----------|
          | \`PDFSignAssistant-$ver-Setup.exe\` | **La mayoría.** Instalador normal: no pide permisos de administrador y crea el acceso directo. |
          | \`PDFSignAssistant-$ver-portable.zip\` | Sin instalar nada (por ejemplo, desde un pendrive). Descomprimir y ejecutar. |

          > Si ya tenés la aplicación instalada no hace falta que bajes nada:
          > te va a avisar sola y se actualiza desde adentro.

          ### La primera vez, Windows va a advertirte

          La aplicación **no está firmada digitalmente**, así que SmartScreen muestra
          *"Windows protegió su PC"*. Para continuar: **Más información → Ejecutar de todas formas**.

          Podés verificar la integridad de la descarga con \`SHA256SUMS.txt\`.

          ### Dónde quedan tus archivos

          - Documentos firmados: \`Documentos\\PDF Sign Assistant\`
          - Configuración y logs: \`%LOCALAPPDATA%\\PDF Sign Assistant\`

          Al desinstalar, **tus documentos no se borran**.

          ---

          El historial completo está en el [CHANGELOG](https://github.com/CrazyK-oss/pdf-sign-assistant/blob/$tag/CHANGELOG.md).
          EOF
          )"

          # La sentinela sale de modules/changelog.py, para no tener el
          # mismo literal escrito en dos lados.
          centinela="$(python -c 'from modules.changelog import SENTINELA; print(SENTINELA)')"

          {
            cat cambios.md
            printf '\n\n%s\n\n' "$centinela"
            printf '%s\n' "$instrucciones"
          } > notas.md

          # El título del CHANGELOG es opcional: si esa versión no lo
          # tiene, el Release se llama sólo por su número.
          subtitulo="$(python -m modules.changelog --titulo "$ver")"
          titulo="PDF Sign Assistant $ver"
          [ -n "$subtitulo" ] && titulo="$titulo — $subtitulo"

          # --target sólo hace falta cuando el tag todavía no existe: en
          # ese caso gh lo crea apuntando a este commit. Si la corrida
          # vino de un tag empujado, el tag ya está y --target sobra.
          destino=()
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            destino=(--target "$GITHUB_SHA")
          fi

          gh release create "$tag" \
            dist/installer/*.exe \
            dist/installer/*.zip \
            dist/installer/SHA256SUMS.txt \
            --title "$titulo" \
            --notes-file notas.md \
            "${destino[@]}"

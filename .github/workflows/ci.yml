name: CI

# Corre en cada push y PR. Es rápido a propósito (no compila el .exe):
# su trabajo es que nunca se publique un release con el árbol roto.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias de test
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      # Las reglas viven en pyproject.toml, no repetidas acá
      - name: Lint
        run: ruff check .

      # Los tests de lógica no necesitan Qt ni pantalla, así que corren sin
      # display virtual y sin instalar las dependencias de la app. Los de
      # integración se saltean solos acá y corren en el job de Release,
      # que sí instala requirements.txt.
      # pyproject.toml define pythonpath=["."] para que `pytest` (el
      # ejecutable, no `python -m pytest`) encuentre el paquete `modules`.
      - name: Tests
        run: pytest tests/ -q

      - name: Verificar que la versión esté bien formada
        run: python -m modules.version
